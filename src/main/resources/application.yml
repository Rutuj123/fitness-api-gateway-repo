server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**,/trainers/**

        - id: member-service
          uri: lb://MEMBER-SERVICE
          predicates:
           - Path=/members/**,/bookings/**,/payments/**,/classes/**,

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443
    status-page-url: https://${EUREKA_INSTANCE_HOSTNAME}/actuator/info
    health-check-url: https://${EUREKA_INSTANCE_HOSTNAME}/actuator/health
    home-page-url: https://${EUREKA_INSTANCE_HOSTNAME}